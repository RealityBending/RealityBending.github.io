<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>🧠 You found it!</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body {
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                background: #111;
                color: #f5f4ef;
                font-family: Georgia, "Times New Roman", serif;
                text-align: center;
                padding: 2rem;
            }
            h1 {
                font-size: clamp(2rem, 5vw, 4rem);
                font-weight: 400;
                margin-bottom: 1rem;
                animation: glow 2.5s ease-in-out infinite alternate;
            }
            p {
                font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
                font-size: 1.1rem;
                line-height: 1.8;
                color: rgba(245, 244, 239, 0.7);
                max-width: 480px;
                margin-bottom: 2.5rem;
            }
            a {
                display: inline-block;
                padding: 0.7rem 2rem;
                border: 1px solid rgba(255, 255, 255, 0.25);
                border-radius: 999px;
                color: #f5f4ef;
                text-decoration: none;
                font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
                font-size: 0.78rem;
                letter-spacing: 0.18em;
                text-transform: uppercase;
                transition:
                    background 0.2s,
                    color 0.2s;
            }
            a:hover {
                background: #f5f4ef;
                color: #111;
            }
            @keyframes glow {
                from {
                    text-shadow: 0 0 20px rgba(255, 204, 0, 0.3);
                }
                to {
                    text-shadow:
                        0 0 40px rgba(255, 204, 0, 0.6),
                        0 0 80px rgba(255, 204, 0, 0.2);
                }
            }
        </style>
    </head>
    <body>
        <h1>🧠 Congratulations!</h1>
        <p>
            You discovered the secret page. You clicked on the brain stem &mdash; the most ancient part of the brain, quietly keeping
            everything running beneath the surface. Just like this hidden page.
        </p>
        <a href="index.html">← Back to Reality</a>
    </body>
</html>
